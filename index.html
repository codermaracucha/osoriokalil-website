<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Osorio Kalil Energy Advisors | Independent Owner's Engineering</title>

  <style>
    :root {
      --navy-deep: #07101f;
      --navy: #0a1628;
      --navy-mid: #0f1f3d;
      --gold: #c9a84c;
      --gold-light: #e8c96a;
      --gold-dim: rgba(201, 168, 76, 0.18);
      --white: #ffffff;
      --muted: #9aa9c0;
      --border: rgba(201, 168, 76, 0.28);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Aptos, "Segoe UI", Arial, sans-serif;
      background: var(--navy-deep);
      color: var(--white);
      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
    }

    .gold {
      color: var(--gold);
    }

    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(7, 16, 31, 0.96);
      border-bottom: 1px solid var(--border);
      padding: 18px 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-area {
      display: flex;
      flex-direction: column;
    }

    .logo-text {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1.4px;
      color: var(--white);
      text-transform: uppercase;
    }

    .logo-tagline {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .button,
    .button-secondary,
    .linkedin-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--gold);
      color: var(--navy-deep);
      padding: 14px 26px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: inherit;
      text-align: center;
    }

    .button:hover,
    .linkedin-button:hover {
      background: var(--gold-light);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(201, 168, 76, 0.24);
    }

    .button-secondary {
      background: transparent;
      color: var(--gold);
      border: 2px solid var(--gold);
    }

    .button-secondary:hover {
      background: var(--gold);
      color: var(--navy-deep);
      transform: translateY(-2px);
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 150px 60px 90px;
      background:
        radial-gradient(circle at 20% 20%, rgba(201, 168, 76, 0.14), transparent 34%),
        radial-gradient(circle at 80% 70%, rgba(22, 42, 82, 0.75), transparent 42%),
        linear-gradient(135deg, #07101f 0%, #0a1628 100%);
    }

    .hero-content {
      max-width: 850px;
    }

    .hero-label {
      font-size: 13px;
      color: var(--gold);
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 800;
      margin-bottom: 22px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .hero-label::before {
      content: "";
      width: 40px;
      height: 2px;
      background: var(--gold);
      display: inline-block;
    }

    .hero-title {
      font-size: clamp(42px, 6vw, 74px);
      font-weight: 850;
      line-height: 1.05;
      margin-bottom: 24px;
      letter-spacing: -1.5px;
    }

    .hero-subtitle {
      font-size: clamp(18px, 2vw, 22px);
      color: var(--muted);
      max-width: 660px;
      margin-bottom: 34px;
    }

    .motto {
      font-size: 14px;
      color: var(--gold-light);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 800;
      margin-bottom: 42px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .motto::before {
      content: "";
      width: 30px;
      height: 2px;
      background: var(--gold);
      display: inline-block;
    }

    .hero-actions {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .section {
      padding: 100px 60px;
    }

    .section-label {
      font-size: 12px;
      color: var(--gold);
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: clamp(32px, 4vw, 48px);
      font-weight: 850;
      line-height: 1.1;
      margin-bottom: 20px;
      letter-spacing: -1px;
    }

    .section-subtitle {
      font-size: 18px;
      color: var(--muted);
      max-width: 740px;
      margin-bottom: 60px;
    }

    .role-grid,
    .services-grid,
    .diff-grid,
    .process-grid {
      display: grid;
      gap: 28px;
    }

    .role-grid,
    .services-grid {
      grid-template-columns: repeat(2, 1fr);
    }

    .diff-grid,
    .process-grid {
      grid-template-columns: repeat(3, 1fr);
    }

    .card {
      background: linear-gradient(135deg, var(--navy-mid), var(--navy));
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 38px;
      transition: all 0.25s ease;
    }

    .card:hover {
      border-color: var(--gold);
      transform: translateY(-4px);
    }

    .card-label {
      font-size: 13px;
      color: var(--gold);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .card h3 {
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 12px;
      color: var(--white);
    }

    .card p {
      color: var(--muted);
      font-size: 15px;
    }

    .services-section,
    .process-section {
      background: var(--navy);
    }

    .service-number {
      font-size: 42px;
      font-weight: 900;
      color: var(--gold-dim);
      line-height: 1;
      margin-bottom: 16px;
    }

    .service-tag {
      display: inline-block;
      margin-top: 18px;
      padding: 7px 14px;
      background: var(--gold-dim);
      color: var(--gold-light);
      border-radius: 4px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .diff-card,
    .step-card {
      text-align: center;
    }

    .step-number {
      width: 76px;
      height: 76px;
      border: 2px solid var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 22px;
      color: var(--gold);
      font-size: 28px;
      font-weight: 900;
    }

    .final-cta {
      text-align: center;
      padding: 120px 60px;
      background: linear-gradient(135deg, var(--navy-deep), var(--navy-mid));
      border-top: 1px solid var(--border);
    }

    .final-cta .section-title {
      max-width: 760px;
      margin: 0 auto 22px;
    }

    .final-cta p {
      font-size: 18px;
      color: var(--muted);
      max-width: 660px;
      margin: 0 auto 42px;
    }

    .final-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 60px;
    }

    .contact-info {
      display: flex;
      gap: 24px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      padding-top: 40px;
      border-top: 1px solid var(--border);
    }

    .contact-item {
      color: var(--muted);
      font-size: 14px;
    }

    .linkedin-button {
      font-size: 13px;
      padding: 14px 22px;
    }

    .site-footer {
      padding: 30px 60px;
      background: var(--navy-deep);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .footer-text {
      font-size: 13px;
      color: var(--muted);
    }

    .footer-motto {
      font-size: 12px;
      color: var(--gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 800;
    }

    @media (max-width: 900px) {
      .site-header {
        padding: 16px 22px;
        gap: 16px;
      }

      .logo-text {
        font-size: 16px;
      }

      .logo-tagline {
        font-size: 10px;
      }

      .site-header .button {
        padding: 10px 14px;
        font-size: 11px;
      }

      .hero {
        padding: 130px 24px 80px;
      }

      .section,
      .final-cta {
        padding: 76px 24px;
      }

      .role-grid,
      .services-grid,
      .diff-grid,
      .process-grid {
        grid-template-columns: 1fr;
      }

      .hero-actions,
      .final-actions {
        flex-direction: column;
        align-items: flex-start;
      }

      .final-actions {
        align-items: center;
      }

      .button,
      .button-secondary,
      .linkedin-button {
        width: 100%;
        max-width: 420px;
        text-align: center;
      }

      .site-footer {
        padding: 24px;
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>

    </div>
