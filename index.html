<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Osorio Kalil Energy Advisors | Independent Owner's Engineering</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.0/index.min.css">

  <style>
    :root {
      --navy-deep: #07101f;
      --navy: #0a1628;
      --navy-mid: #0f1f3d;
      --navy-light: #162a52;
      --gold: #c9a84c;
      --gold-light: #e8c96a;
      --gold-dim: rgba(201, 168, 76, 0.2);
      --white: #ffffff;
      --muted: #8a9bb5;
      --border: rgba(201, 168, 76, 0.25);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--navy-deep);
      color: var(--white);
      overflow-x: hidden;
      line-height: 1.6;
    }

    .gold {
      color: var(--gold);
    }

    /* Header */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(7, 16, 31, 0.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 18px 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
    }

    .logo-area {
      display: flex;
      flex-direction: column;
    }

    .logo-text {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--white);
    }

    .logo-tagline {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .header-cta {
      background: var(--gold);
      color: var(--navy-deep);
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      border: none;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .header-cta:hover {
      background: var(--gold-light);
      transform: translateY(-2px);
    }

    /* Hero */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 150px 60px 90px;
      position: relative;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(201, 168, 76, 0.14), transparent 35%),
        radial-gradient(circle at 80% 70%, rgba(22, 42, 82, 0.75), transparent 40%),
        #07101f;
      opacity: 1;
    }

    .hero-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(7, 16, 31, 0.88), rgba(10, 22, 40, 0.72));
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 820px;
    }

    .hero-label {
      font-size: 13px;
      color: var(--gold);
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 20px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .hero-label::before {
      content: '';
      width: 40px;
      height: 2px;
      background: var(--gold);
    }

    .hero-title {
      font-size: clamp(40px, 6vw, 72px);
      font-weight: 800;
      line-height: 1.05;
      margin-bottom: 24px;
      letter-spacing: -2px;
    }

    .hero-subtitle {
      font-size: clamp(18px, 2vw, 22px);
      color: var(--muted);
      margin-bottom: 32px;
      line-height: 1.5;
      max-width: 640px;
    }

    .motto {
      font-size: 14px;
      color: var(--gold-light);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .motto::before {
      content: '';
      width: 30px;
      height: 2px;
      background: var(--gold);
    }

    .hero-cta-group {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .cta-button {
      display: inline-block;
      background: var(--gold);
      color: var(--navy-deep);
      padding: 18px 40px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      border: none;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .cta-button:hover {
      background: var(--gold-light);
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(201, 168, 76, 0.3);
    }

    .cta-button.outline {
      background: transparent;
      color: var(--gold);
      border: 2px solid var(--gold);
    }

    .cta-button.outline:hover {
      background: var(--gold);
      color: var(--navy-deep);
    }

    /* Sections */
    .section {
      padding: 100px 60px;
      position: relative;
    }

    .section-label {
      font-size: 12px;
      color: var(--gold);
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: clamp(32px, 4vw, 48px);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 20px;
      letter-spacing: -1px;
    }

    .section-subtitle {
      font-size: 18px;
      color: var(--muted);
      max-width: 720px;
      margin-bottom: 60px;
    }

    /* Challenge */
    .role-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
    }

    .role-card {
      background: linear-gradient(135deg, var(--navy-mid), var(--navy));
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      position: relative;
      overflow: hidden;
      transition: all 0.4s ease;
    }

    .role-card:hover {
      border-color: var(--gold);
      transform: translateY(-4px);
    }

    .role-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--gold);
    }

    .role-icon {
      width: 56px;
      height: 56px;
      background: var(--gold-dim);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      color: var(--gold);
    }

    .role-card h3 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .role-for {
      font-size: 13px;
      color: var(--gold);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .role-card p {
      font-size: 16px;
      color: var(--muted);
      line-height: 1.6;
    }

    /* Services */
    .services-section {
      background: var(--navy);
    }

    .services-grid-web {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .svc-card {
      background: var(--navy-mid);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px;
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
    }

    .svc-card:hover {
      border-color: var(--gold);
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .svc-number {
      position: absolute;
      top: 20px;
      right: 24px;
      font-size: 48px;
      font-weight: 800;
      color: var(--gold-dim);
      line-height: 1;
    }

    .svc-card h3 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--white);
      max-width: 80%;
    }

    .svc-sub {
      font-size: 13px;
      color: var(--gold);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .svc-card p {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.6;
    }

    .svc-tag {
      display: inline-block;
      margin-top: 16px;
      padding: 6px 14px;
      background: var(--gold-dim);
      color: var(--gold-light);
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Differentiators */
    .diff-grid-web {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px;
    }

    .diff-card-web {
      text-align: center;
      padding: 40px 30px;
      background: var(--navy-mid);
      border: 1px solid var(--border);
      border-radius: 16px;
      transition: all 0.4s ease;
    }

    .diff-card-web:hover {
      border-color: var(--gold);
      transform: translateY(-4px);
    }

    .diff-icon-web {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      background: var(--gold-dim);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
    }

    .diff-card-web h3 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--gold-light);
    }

    .diff-card-web p {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.6;
    }

    /* Process */
    .process-section {
      background: var(--navy);
    }

    .process-steps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      position: relative;
    }

    .process-steps::before {
      content: '';
      position: absolute;
      top: 40px;
      left: 15%;
      right: 15%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      z-index: 0;
    }

    .step-card {
      text-align: center;
      position: relative;
      z-index: 1;
      padding: 20px;
    }

    .step-num {
      width: 80px;
      height: 80px;
      background: var(--navy-mid);
      border: 2px solid var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 28px;
      font-weight: 800;
      color: var(--gold);
    }

    .step-card h3 {
      font-size: 18px;
      font-weight: 700;
      color: var(--gold-light);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .step-card p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
    }

    /* Final CTA */
    .final-cta {
      text-align: center;
      padding: 120px 60px;
      position: relative;
      background: linear-gradient(135deg, var(--navy-deep), var(--navy-mid));
    }

    .final-cta::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 3px;
      background: var(--gold);
    }

    .final-cta .section-title {
      max-width: 720px;
      margin: 0 auto 20px;
    }

    .final-cta p {
      font-size: 18px;
      color: var(--muted);
      max-width: 640px;
      margin: 0 auto 40px;
    }

    .final-cta-actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 60px;
    }

    .contact-info {
      display: flex;
      gap: 30px;
      justify-content: center;
      flex-wrap: wrap;
      padding-top: 40px;
      border-top: 1px solid var(--border);
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 14px;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .contact-item:hover {
      color: var(--gold-light);
    }

    .contact-item svg {
      color: var(--gold);
      flex-shrink: 0;
    }

    /* Footer */
    .site-footer {
      padding: 30px 60px;
      background: var(--navy-deep);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .footer-text {
      font-size: 13px;
      color: var(--muted);
    }

    .footer-motto {
      font-size: 12px;
      color: var(--gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* Animations safe version */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-in,
    .delay-1,
    .delay-2,
    .delay-3,
    .delay-4 {
      opacity: 1;
      transform: translateY(0);
      animation: fadeInUp 0.8s ease forwards;
    }

    .delay-1 {
      animation-delay: 0.1s;
    }

    .delay-2 {
      animation-delay: 0.2s;
    }

    .delay-3 {
      animation-delay: 0.3s;
    }

    .delay-4 {
      animation-delay: 0.4s;
    }

    .reveal {
      opacity: 1;
      transform: translateY(0);
      transition: all 0.8s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Responsive */
    @media (max-width: 900px) {
      .site-header {
        padding: 14px 20px;
        gap: 16px;
      }

      .logo-text {
        font-size: 15px;
      }

      .logo-tagline {
        font-size: 10px;
      }

      .header-cta {
        padding: 10px 14px;
        font-size: 11px;
      }

      .hero {
        padding: 120px 24px 70px;
      }

      .section {
        padding: 70px 24px;
      }

      .role-grid,
      .services-grid-web,
      .diff-grid-web,
      .process-steps {
        grid-template-columns: 1fr;
      }

      .process-steps::before {
        display: none;
      }

      .final-cta {
        padding: 80px 24px;
      }

      .site-footer {
        padding: 24px;
        flex-direction: column;
        text-align: center;
      }

      .hero-cta-group,
      .final-cta-actions {
        flex-direction: column;
        align-items: flex-start;
      }

      .final-cta-actions {
        align-items: center;
      }

      .cta-button {
        width: 100%;
        max-width: 360px;
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header class="site-header">
    <div class="logo-area">
      <div class="logo-text">OSORIO <span class="gold">&
